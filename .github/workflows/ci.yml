name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DSSC32_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify installation
        run: cmake --install build --prefix "${{ runner.temp }}/ssc32-install"

  colcon:
    name: colcon · ROS 2 Lyrical
    runs-on: ubuntu-latest
    container: ros:lyrical-ros-base
    steps:
      - uses: actions/checkout@v5
        with:
          path: src/ssc32
      - name: Build as a plain CMake package
        run: colcon build --packages-select ssc32 --event-handlers console_direct+
      - name: Test
        run: colcon test --packages-select ssc32 --event-handlers console_direct+
      - name: Report test results
        run: colcon test-result --verbose
